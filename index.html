function drawSprite(sp, x, y, scale, flip, alpha) {
  if (alpha !== undefined && alpha < 1) { ctx.save(); ctx.globalAlpha = alpha; }
  const rows = sp.rows;
  for (let j = 0; j < rows.length; j++) {
    const row = rows[j];
    for (let i = 0; i < row.length; i++) {
      const c = PAL[row[i]];
      if (!c) continue;
      const px = flip ? x + (sp.w - 1 - i) * scale : x + i * scale;
      ctx.fillStyle = c;
      ctx.fillRect(px | 0, (y + j * scale) | 0, scale, scale);
    }
  }
  if (alpha !== undefined && alpha < 1) ctx.restore();
}

const ROWS = 15;
const LEVEL_H = ROWS * TILE;
let MAP = [], ORIG = [], COLS = 0, LEVEL_W = 0, theme = 'ground';

function buildMap(chunks) {
  MAP = [];
  for (let r = 0; r < ROWS; r++) {
    let line = '';
    for (let c = 0; c < chunks.length; c++) line += chunks[c][r];
    MAP.push(line.split(''));
  }
  ORIG = MAP.map(function (r) { return r.slice(); });
  COLS = MAP[0].length;
  LEVEL_W = COLS * TILE;
}

const SOLID = { '#': 1, '=': 1, 'X': 1, '?': 1, '!': 1, '1': 1, 'K': 1, 'U': 1 };
function tileAt(cx, ry) {
  if (ry < 0 || ry >= ROWS || cx < 0 || cx >= COLS) return '.';
  return MAP[ry][cx];
}
function isSolid(cx, ry) {
  if (cx < 0 || cx >= COLS) return true;   // 壁で外に出られない
  if (ry < 0) return false;
  if (ry >= ROWS) return false;
  return !!SOLID[MAP[ry][cx]];
}

let AC = null;
function beep(freq, dur, type, vol) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.value = vol === undefined ? 0.05 : vol;
    o.connect(g); g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur);
  } catch (e) { /* 音が出せない環境では黙って続行 */ }
}

};
window.addEventListener('keydown', function (e) {
  const k = KEYMAP[e.code];
  if (k) {
    e.preventDefault();
    if (k === 'jump' && !keys.jump) jumpPressed = true;
    if (k === 'throw' && !keys.throw) throwPressed = true;
    keys[k] = true;
  }
  if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); pressAnyKey(); }
});
window.addEventListener('keyup', function (e) {
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); keys[k] = false; }
});

document.querySelectorAll('.btn').forEach(function (btn) {
  const k = btn.dataset.k;
  let pid = null;
  function down(e) {
    e.preventDefault();
    // 指をボタンから滑らせても離した合図を取りこぼさないようにする
    pid = e.pointerId;
    try { btn.setPointerCapture(e.pointerId); } catch (err) { /* 対応外の環境は無視 */ }
    btn.classList.add('on');
    if (k === 'jump' && !keys.jump) jumpPressed = true;
    if (k === 'throw' && !keys.throw) throwPressed = true;
    keys[k] = true;
    pressAnyKey();
  }
  function up(e) {
    e.preventDefault();
    if (pid !== null) { try { btn.releasePointerCapture(pid); } catch (err) { } pid = null; }
    btn.classList.remove('on');
    keys[k] = false;
  }
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
});

/* --- スマホで画面が勝手に拡大・スクロールしないようにする ---
   ボタン連打がダブルタップと誤解されて拡大されるのを防ぐ。
   iOSのSafariは user-scalable=no を無視するため、JS側でも止める。 */
(function preventZoom() {
  const stop = function (e) { e.preventDefault(); };
  // ピンチ操作（iOS Safari 独自イベント）
  document.addEventListener('gesturestart', stop, { passive: false });
  document.addEventListener('gesturechange', stop, { passive: false });
  document.addEventListener('gestureend', stop, { passive: false });
  // 2本指以上のタッチ移動（ピンチ・ページのスクロール）
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  // ダブルタップ拡大
  document.addEventListener('dblclick', stop, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    if (now - lastTouchEnd <= 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  // 何かの拍子に押しっぱなしになったボタンを戻す保険
  function releaseAll() {
    keys.left = keys.right = keys.jump = keys.throw = false;
    document.querySelectorAll('.btn').forEach(function (b) { b.classList.remove('on'); });
  }
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) releaseAll();
  });
})();

/* ---------------------------------------------------------
   6. 当たり判定ヘルパー
   --------------------------------------------------------- */
function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function moveBox(o, gravity, maxFall) {
  // 横
  o.x += o.vx;
  let c0 = Math.floor(o.x / TILE), c1 = Math.floor((o.x + o.w - 1) / TILE);
  let r0 = Math.floor(o.y / TILE), r1 = Math.floor((o.y + o.h - 1) / TILE);
  for (let r = r0; r <= r1; r++) {
    if (o.vx > 0 && isSolid(c1, r)) { o.x = c1 * TILE - o.w - 0.01; o.vx = 0; o.hitWall = 1; }
    else if (o.vx < 0 && isSolid(c0, r)) { o.x = (c0 + 1) * TILE + 0.01; o.vx = 0; o.hitWall = -1; }
  }
  // 縦
  o.vy += gravity;
  if (o.vy > maxFall) o.vy = maxFall;
  o.y += o.vy;
  o.onGround = false;
  c0 = Math.floor(o.x / TILE); c1 = Math.floor((o.x + o.w - 1) / TILE);
  r0 = Math.floor(o.y / TILE); r1 = Math.floor((o.y + o.h - 1) / TILE);
  for (let c = c0; c <= c1; c++) {
    if (o.vy > 0 && isSolid(c, r1)) { o.y = r1 * TILE - o.h - 0.01; o.vy = 0; o.onGround = true; }
    else if (o.vy < 0 && isSolid(c, r0)) { o.y = (r0 + 1) * TILE + 0.01; o.vy = 0; o.bumped = c; o.bumpRow = r0; }
  }
}

    items.push({
      type: 'crown', x: c * TILE + 4, y: r * TILE - 4, spawnY: r * TILE,
      w: 24, h: 16, vx: 0, vy: -3, pop: 16

      w: 30, h: 20, vx: 0, vy: -3, pop: 16
    });

      w: 28, h: 24, vx: 0, vy: -3, pop: 16
    });
    sfxCrown();
    showMsg('コブタがあらわれた！', 110);
  } else if (t === '=') {
    if (player.crown) {
      MAP[r][c] = '.';
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: c * TILE + 16, y: r * TILE + 16,
          vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 5 - 1,
          life: 40, col: '#c26b3a'
        });
      }
      sfxKill(); score += 20;
    } else {
      particles.push({ x: c * TILE + 16, y: r * TILE + 4, vx: 0, vy: -2, life: 14, col: '#c26b3a' });
      beep(140, 0.06, 'square', 0.03);
    }
  }
}

/* ---------------------------------------------------------
   8. 更新処理
   --------------------------------------------------------- */
function updatePlayer() {
  const ch = CHARS[charIdx];

  if (player.deadTimer > 0) {
    player.deadTimer--;
    player.vy += 0.5;
    player.y += player.vy;
    if (player.deadTimer === 0) afterDeath();
    return;
  }

  const accel = player.onGround ? 0.75 : 0.42;
  if (keys.left) { player.vx -= accel; player.face = -1; }
  if (keys.right) { player.vx += accel; player.face = 1; }
  if (!keys.left && !keys.right) player.vx *= player.onGround ? 0.80 : 0.94;
  if (player.vx > ch.speed) player.vx = ch.speed;
  if (player.vx < -ch.speed) player.vx = -ch.speed;
  if (Math.abs(player.vx) < 0.05) player.vx = 0;

  // 少しの猶予（コヨーテタイム＋先行入力）で操作をやさしくする
  if (player.onGround) player.coyote = 7; else if (player.coyote > 0) player.coyote--;
  if (jumpPressed) player.jbuf = 8;
  if (player.jbuf > 0) player.jbuf--;
  if (player.jbuf > 0 && player.coyote > 0) {
    player.vy = ch.jump; player.coyote = 0; player.jbuf = 0; player.onGround = false; sfxJump();
  }
  jumpPressed = false;
  // 短押しで低いジャンプ
  if (!keys.jump && player.vy < -4) player.vy = -4;

  player.bumped = undefined;
  moveBox(player, 0.58, 14);
  if (player.bumped !== undefined) bumpBlock(player.bumped, player.bumpRow);

  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > LEVEL_W) { player.x = LEVEL_W - player.w; player.vx = 0; }

  // うんこを投げる
  if (player.throwCool > 0) player.throwCool--;
  if (throwPressed) {
    if (player.crown && player.throwCool === 0 && poops.length < 4) {
      poops.push({
        x: player.x + (player.face > 0 ? player.w : -12), y: player.y + 8,
        w: 14, h: 14, vx: player.face * 5.4 + player.vx * 0.3, vy: -3.6, life: 200, spin: 0
      });
      player.throwCool = 18;
      sfxThrow();
    } else if (!player.crown) {
      showMsg('王冠がないと投げられない！', 60);
    }
  }
  throwPressed = false;

  if (player.inv > 0) player.inv--;

  // アニメーション
  if (!player.onGround) player.anim = 2;
  else if (Math.abs(player.vx) > 0.4) player.anim = (Math.floor(frameCount / 6) % 2);
  else player.anim = 0;

  // 落下死
  if (player.y > LEVEL_H + 60) killPlayer(true);

  // ゴール
  const gc = Math.floor((player.x + player.w / 2) / TILE);
  if (tileAt(gc, 12) === 'G' || tileAt(gc, 11) === 'G') doClear();

  // チェックポイント
  const cp = Math.floor(player.x / (20 * TILE)) * 20 * TILE + 64;
  if (cp > checkpointX) { checkpointX = cp; }
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dead) {
      e.dead--;
      e.y += 3; e.rot = (e.rot || 0) + 0.3;
      if (e.dead <= 0) enemies.splice(i, 1);
      continue;
    }
    // 画面から遠い敵は休ませる（動作を軽くする）
    if (e.x < cam.x - 420 || e.x > cam.x + VW + 420) continue;

    e.hitWall = 0;
    if (e.type === 'wolf') {
      moveBox(e, 0.5, 12);
      if (e.hitWall) e.vx = -e.vx || 1.1;
      // 崖で引き返す
      if (e.onGround) {
        const ahead = Math.floor((e.vx > 0 ? e.x + e.w + 4 : e.x - 4) / TILE);
        const below = Math.floor((e.y + e.h + 4) / TILE);
        if (!isSolid(ahead, below)) e.vx = -e.vx;
      }
      if (e.vx === 0) e.vx = 1.1;
      e.anim = Math.floor(frameCount / 8) % 2;
    } else if (e.type === 'mouse') {
      // すばしこいネズミ: 速く歩く → 身を沈めて溜める → 猛ダッシュ
      e.timer--;
      const dir = e.vx >= 0 ? 1 : -1;
      if (e.phase === 'walk') {
        if (Math.abs(e.vx) > e.base) e.vx = dir * e.base;
        if (e.timer <= 0) {
          e.phase = 'crouch'; e.timer = 26;
          // プレイヤーの方を向いて構える
          e.vx = (player.x < e.x ? -0.001 : 0.001);
        }
      } else if (e.phase === 'crouch') {
        e.vx = 0;
        if (e.timer <= 0) {
          e.phase = 'dash'; e.timer = 30;
          e.vx = (player.x < e.x ? -e.dash : e.dash);
        }
      } else {
        if (e.timer <= 0) {
          e.phase = 'walk'; e.timer = 120 + Math.random() * 90;
          e.vx = (e.vx >= 0 ? e.base : -e.base);
        }
      }
      moveBox(e, 0.5, 12);
      if (e.hitWall) { e.vx = -e.vx || e.base; if (e.phase === 'dash') { e.phase = 'walk'; e.timer = 60; } }
      // 崖で引き返す
      if (e.onGround) {
        const ahead = Math.floor((e.vx > 0 ? e.x + e.w + 5 : e.x - 5) / TILE);
        const below = Math.floor((e.y + e.h + 4) / TILE);
        if (!isSolid(ahead, below)) {
          e.vx = -e.vx;
          if (e.phase === 'dash') { e.phase = 'walk'; e.timer = 60; }
        }
      }
      if (e.vx === 0 && e.phase !== 'crouch') e.vx = e.base;
      e.anim = e.phase === 'crouch' ? 0 : Math.floor(frameCount / (e.phase === 'dash' ? 3 : 6)) % 2;
    } else {
      // キモオタ: 歩く → 構える → フラッシュ
      e.timer--;
      if (e.phase === 'walk') {
        moveBox(e, 0.5, 12);
        if (e.hitWall) e.vx = -e.vx || 0.5;
        if (e.onGround) {
          const ahead = Math.floor((e.vx > 0 ? e.x + e.w + 4 : e.x - 4) / TILE);
          const below = Math.floor((e.y + e.h + 4) / TILE);
          if (!isSolid(ahead, below)) e.vx = -e.vx;
        }
        if (e.vx === 0) e.vx = 0.5;
        e.anim = Math.floor(frameCount / 12) % 2;
        if (e.timer <= 0) {
          // プレイヤーの方を向いて構える
          e.vx = (player.x < e.x ? -Math.abs(e.vx) : Math.abs(e.vx));
          e.phase = 'aim'; e.timer = 42;
        }
      } else if (e.phase === 'aim') {
        e.vx = 0; e.vy = 0;
        moveBox(e, 0.5, 12);
        e.anim = 0;
        if (e.timer <= 0) { e.phase = 'flash'; e.timer = 20; e.flash = 20; beep(1600, 0.08, 'sine', 0.05); }
      } else {
        e.vx = 0;
        moveBox(e, 0.5, 12);
        e.flash = e.timer;
        if (e.timer <= 0) {
          e.phase = 'walk'; e.timer = 120 + Math.random() * 90;
          e.vx = (player.x < e.x ? -0.5 : 0.5);
        }
      }
      e.face = e.vx !== 0 ? (e.vx > 0 ? 1 : -1) : (e.face || -1);
    }
    if (e.type === 'wolf') e.face = e.vx > 0 ? 1 : -1;
    if (e.type === 'mouse') { if (e.vx !== 0) e.face = e.vx > 0 ? 1 : -1; }

    if (e.y > LEVEL_H + 80) { enemies.splice(i, 1); continue; }

    // プレイヤーとの接触
    if (player.deadTimer === 0 && hit(player, e)) {
      const stomping = player.vy > 1 && (player.y + player.h) - player.vy <= e.y + 10;
      if (stomping) {
        killEnemy(e, 'stomp');
        player.vy = -8.2;
      } else if (player.inv === 0) {
        damagePlayer();
      }
    }
    // フラッシュ判定
    if (e.type === 'otaku' && e.phase === 'flash' && e.flash > 6 && player.deadTimer === 0 && player.inv === 0) {
      const dir = e.face || -1;
      const beam = { x: dir > 0 ? e.x + e.w : e.x - 92, y: e.y + 6, w: 92, h: 22 };
      if (hit(player, beam)) damagePlayer();
    }
  }
}

function killEnemy(e, how) {
  if (e.dead) return;
  e.dead = 30;
  const base = e.type === 'mouse' ? 400 : 200;   // ネズミは素早いので高得点
  score += how === 'poop' ? base + 100 : base;
  popups.push({ x: e.x, y: e.y, t: '+' + (how === 'poop' ? base + 100 : base), life: 45 });
  sfxKill();
  const col = e.type === 'wolf' ? '#8b7f70' : (e.type === 'mouse' ? '#c3cad3' : '#7ecb52');
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: e.x + e.w / 2, y: e.y + e.h / 2,
      vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 5 - 1,
      life: 34, col: how === 'poop' ? '#8b5a2b' : col
    });
  }
  shake = 6;
}

function updatePoops() {
  for (let i = poops.length - 1; i >= 0; i--) {
    const p = poops[i];
    p.life--; p.spin += 0.25;
    p.hitWall = 0;
    moveBox(p, 0.34, 12);
    if (p.onGround) p.vy = -5.2;
    if (p.hitWall) { p.vx = -p.vx * 0.6; if (Math.abs(p.vx) < 1) p.life = 0; }
    let gone = false;
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (!e.dead && hit(p, e)) { killEnemy(e, 'poop'); gone = true; break; }
    }
    if (gone || p.life <= 0 || p.y > LEVEL_H + 40) {
      for (let k = 0; k < 4; k++) {
        particles.push({ x: p.x + 6, y: p.y + 6, vx: (Math.random() - .5) * 4, vy: -Math.random() * 3, life: 20, col: '#8b5a2b' });
      }
      poops.splice(i, 1);
    }
  }
}

function updateItems() {
  // マップ上のコイン
  const c0 = Math.floor(player.x / TILE), c1 = Math.floor((player.x + player.w) / TILE);
  const r0 = Math.floor(player.y / TILE), r1 = Math.floor((player.y + player.h) / TILE);
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      if (tileAt(c, r) === 'C') {
        MAP[r][c] = '.';
        coins++; score += 100; sfxCoin();
        popups.push({ x: c * TILE + 8, y: r * TILE, t: '+100', life: 40 });
      }
    }
  }
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.pop > 0) {
      // ブロックから飛び出す演出（この間は壁を無視）
      it.y += it.vy; it.pop--;
      if (it.pop === 0) { it.vx = player.x > it.x ? 1.4 : -1.4; it.vy = 0; }
    } else {
      it.hitWall = 0;
      moveBox(it, 0.4, 10);
      if (it.hitWall) it.vx = -it.vx || 1.4;
      // 出てきたブロックの上からは落ちる。下の足場に着いたら端で引き返す
      if (it.onGround && it.y > it.spawnY + 8) {
        const ahead = Math.floor((it.vx > 0 ? it.x + it.w + 3 : it.x - 3) / TILE);
        const below = Math.floor((it.y + it.h + 4) / TILE);
        if (!isSolid(ahead, below)) it.vx = -it.vx;
      }
      if (it.vx === 0) it.vx = 1.4;
      if (it.y > LEVEL_H + 60) { items.splice(i, 1); continue; }
    }
    const box = { x: it.x, y: it.y, w: it.w, h: it.h };
    if (hit(player, box)) {
      if (it.type === 'crown') {
        player.crown = true;
        score += 500;
        showMsg('👑 ロマ子様 パワーアップ！ 💩 を投げろ！', 130);
        sfxCrown();
        for (let k = 0; k < 12; k++) {
          particles.push({ x: it.x + 12, y: it.y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 6, life: 40, col: '#ffc93c' });
        }
      } else if (it.type === 'kobuta') {
        pet = { x: player.x, y: player.y + 10, face: player.face };
        petTrail = [];
        score += 300;
        showMsg('コブタが仲間になった！ 1回だけ守ってくれる', 140);
        sfxCrown();
        for (let k = 0; k < 12; k++) {
          particles.push({ x: it.x + 14, y: it.y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 6, life: 40, col: '#ffb0c4' });
        }
      } else if (it.type === 'hairpin') {
        lives++;
        showMsg('❤ 1UP！ 残り ' + lives + '人', 130);
        popups.push({ x: it.x, y: it.y - 6, t: '1UP', life: 70, col: '#ff5c6c' });
        sfx1up();
        for (let k = 0; k < 12; k++) {
          particles.push({ x: it.x + 13, y: it.y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 6, life: 40, col: '#ef4444' });
        }
      }
      items.splice(i, 1);
    }
  }
}

function damagePlayer() {
  // コブタが身代わりになってくれる
  if (pet) {
    popups.push({
      x: pet.x - 44, y: pet.y - 6, t: 'グェー死んだンゴ',
      life: 120, col: '#ffd93b', big: true, vy: -0.55
    });
    for (let k = 0; k < 16; k++) {
      particles.push({
        x: pet.x + 14, y: pet.y + 12,
        vx: (Math.random() - .5) * 8, vy: -Math.random() * 7 - 1,
        life: 44, col: k % 2 ? '#ffb0c4' : '#e0789a'
      });
    }
    pet = null; petTrail = [];
    player.inv = 100;
    shake = 9;
    beep(300, 0.1, 'square', 0.05);
    setTimeout(function () { beep(180, 0.3, 'sawtooth', 0.05); }, 90);
    return;
  }
  if (player.crown) {
    player.crown = false;
    player.inv = 100;
    sfxDamage();
    showMsg('王冠を落とした…！', 70);
    shake = 8;
    for (let k = 0; k < 10; k++) {
      particles.push({ x: player.x + 12, y: player.y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 6, life: 40, col: '#ffc93c' });
    }
  } else {
    killPlayer(false);
  }
}

function killPlayer(fell) {
  if (player.deadTimer > 0) return;
  player.deadTimer = fell ? 1 : 70;
  player.vy = fell ? 0 : -9;
  player.vx = 0;
  player.crown = false;
  sfxDamage();
  shake = 10;
  if (!fell) showMsg(CHARS[charIdx].name + ' やられた…', 70);
}

function afterDeath() {
  lives--;
  if (lives <= 0) {
    state = 'over';
    return;
  }
  charIdx = (charIdx + 1) % CHARS.length;
  showMsg(CHARS[charIdx].name + ' 、交代で出るわよ！', 110);
  // 復帰地点まわりの敵を戻す
  resetLevelObjects();
  spawnPlayer(checkpointX);
}

function doClear() {
  if (state !== 'play') return;
  score += lives * 1000 + Math.floor(timeLeft) * 10;
  sfxClear();
  if (stage < STAGES.length - 1) { state = 'clear'; clearTimer = 200; }
  else { state = 'allclear'; }
}

/* ---------------------------------------------------------
   8-b. ボス: 二本足の虎
   眠っている → 咆哮（雑魚を呼ぶ）→ 突進 → 跳びかかり（落石）の繰り返し
   --------------------------------------------------------- */
function updateBoss() {
  if (bossWin > 0) {
    bossWin--;
    if (bossWin % 7 === 0 && boss) {
      particles.push({
        x: boss.x + Math.random() * boss.w, y: boss.y + Math.random() * boss.h,
        vx: (Math.random() - .5) * 5, vy: -Math.random() * 5 - 1, life: 40, col: '#f0801f'
      });
    }
    if (bossWin === 1) { boss = null; doClear(); }
    return;
  }
  const b = boss;
  if (!b || b.dead) return;
  if (b.inv > 0) b.inv--;

  const px = player.x + player.w / 2;
  const bx = b.x + b.w / 2;

  if (b.phase === 'sleep') {
    // 近づくまで待ちかまえる
    if (Math.abs(px - bx) < 300) {
      b.phase = 'roar'; b.timer = 70;
      showMsg('虎があらわれた！', 120);
      beep(90, 0.7, 'sawtooth', 0.07);
      shake = 12;
    }
    b.anim = 0;
    moveBox(b, 0.6, 14);
    return;
  }

  b.face = px < bx ? -1 : 1;
  b.timer--;

  if (b.phase === 'roar') {
    b.vx = 0;
    if (b.timer <= 0) {
      // 咆哮で雑魚を呼ぶ（増えすぎないよう2体までに抑える）
      const alive = enemies.filter(function (e) { return !e.dead; }).length;
      if (alive < 2) {
        const sx = b.x + (b.roars % 2 ? 46 : -66);
        enemies.push(b.roars % 2 === 0 ? makeMouse(sx, b.y + 32) : makeWolf(sx, b.y + 32));
      }
      b.roars++;
      b.phase = 'walk'; b.timer = 60;
      beep(120, 0.4, 'sawtooth', 0.06);
    }
  } else if (b.phase === 'walk') {
    b.vx = b.face * 1.1;
    if (b.timer <= 0) {
      b.phase = Math.random() < 0.55 ? 'crouch' : 'leapReady';
      b.timer = b.phase === 'crouch' ? 30 : 26;
    }
  } else if (b.phase === 'crouch') {
    // 突進の溜め
    b.vx = 0;
    if (b.timer <= 0) { b.phase = 'dash'; b.timer = 46; b.vx = b.face * 5.0; beep(200, 0.15, 'sawtooth', 0.05); }
  } else if (b.phase === 'dash') {
    if (b.timer <= 0 || b.hitWall) { b.phase = 'walk'; b.timer = 70; b.vx = 0; }
  } else if (b.phase === 'leapReady') {
    b.vx = 0;
    if (b.timer <= 0) {
      b.phase = 'leap'; b.timer = 120;
      b.vy = -13.5; b.vx = b.face * 3.0;
      beep(420, 0.16, 'square', 0.05);
    }
  } else if (b.phase === 'leap') {
    if (b.onGround && b.vy === 0 && b.timer < 110) {
      // 着地: 地震＋天井から落石
      b.phase = (b.roars < 3 && Math.random() < 0.5) ? 'roar' : 'walk';
      b.timer = b.phase === 'roar' ? 60 : 80;
      b.vx = 0;
      shake = 16;
      beep(70, 0.4, 'sawtooth', 0.07);
      const n = 4;
      for (let i = 0; i < n; i++) {
        rocks.push({
          x: player.x - 120 + Math.random() * 240 + i * 8, y: 40 + Math.random() * 30,
          w: 18, h: 18, vy: 0, life: 220, spin: Math.random() * 6
        });
      }
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: b.x + Math.random() * b.w, y: b.y + b.h,
          vx: (Math.random() - .5) * 8, vy: -Math.random() * 4, life: 30, col: '#c9b48a'
        });
      }
    }
  }

  b.hitWall = 0;
  moveBox(b, 0.6, 15);
  if (b.hitWall && b.phase !== 'leap') b.vx = 0;
  b.anim = (b.phase === 'dash') ? (Math.floor(frameCount / 3) % 2)
    : (b.phase === 'walk' ? (Math.floor(frameCount / 9) % 2) : 0);

  // プレイヤーとの接触・踏みつけ
  if (player.deadTimer === 0 && hit(player, b)) {
    const stomping = player.vy > 1 && (player.y + player.h) - player.vy <= b.y + 16;
    if (stomping) {
      hurtBoss(1, 'stomp');
      player.vy = -9.5;
    } else if (player.inv === 0) {
      damagePlayer();
      // 押し返す
      player.vx = (player.x < b.x ? -4 : 4);
    }
  }
  // うんこが当たったら
  for (let i = poops.length - 1; i >= 0; i--) {
    if (hit(poops[i], b)) {
      for (let k = 0; k < 5; k++) {
        particles.push({ x: poops[i].x, y: poops[i].y, vx: (Math.random() - .5) * 5, vy: -Math.random() * 4, life: 24, col: '#8b5a2b' });
      }
      poops.splice(i, 1);
      hurtBoss(1, 'poop');
    }
  }
}

function hurtBoss(dmg, how) {
  const b = boss;
  if (!b || b.inv > 0 || bossWin > 0) return;
  b.hp -= dmg;
  b.inv = 46;
  // ひるませる（踏んだ直後に突進されないように）
  b.phase = 'walk'; b.timer = 50; b.vx = 0;
  score += how === 'poop' ? 300 : 200;
  shake = 10;
  sfxKill();
  for (let k = 0; k < 10; k++) {
    particles.push({
      x: b.x + b.w / 2, y: b.y + b.h / 2,
      vx: (Math.random() - .5) * 8, vy: -Math.random() * 6, life: 36, col: '#f0801f'
    });
  }
  if (b.hp <= 0) {
    b.hp = 0;
    bossWin = 130;
    score += 5000;
    popups.push({ x: b.x - 20, y: b.y, t: '+5000', life: 90 });
    showMsg('虎を倒した！！', 130);
    sfxClear();
  } else {
    popups.push({ x: b.x + 10, y: b.y, t: 'のこり ' + b.hp, life: 45, col: '#ffd93b' });
  }
}

function drawBoss() {
  const b = boss;
  if (!b) return;
  if (b.inv > 0 && Math.floor(frameCount / 3) % 2 === 0 && bossWin === 0) return;
  const x = b.x - cam.x - 7, y = b.y - 4;
  ctx.save();
  if (bossWin > 0) {
    ctx.globalAlpha = Math.max(0, bossWin / 130);
    ctx.translate(x + 40, y + 44); ctx.rotate((130 - bossWin) * 0.02); ctx.translate(-(x + 40), -(y + 44));
  }
  // 溜め・突進の見せ方
  if (b.phase === 'crouch' || b.phase === 'leapReady') {
    ctx.fillStyle = 'rgba(255,90,60,' + (0.35 + Math.sin(frameCount / 2.5) * 0.3) + ')';
    ctx.fillRect(x + 8, y - 14, 62, 7);
  } else if (b.phase === 'dash') {
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    for (let s = 1; s <= 4; s++) ctx.fillRect(x + (b.face > 0 ? -12 * s : 76 + 12 * s), y + 18 + s * 11, 11, 4);
  }
  drawSprite(TIGER[b.anim || 0], x, y, 4, b.face > 0);
  ctx.restore();
}

function updateRocks() {
  for (let i = rocks.length - 1; i >= 0; i--) {
    const r = rocks[i];
    r.vy += 0.42; if (r.vy > 11) r.vy = 11;
    r.y += r.vy; r.life--; r.spin += 0.12;
    // 地面に当たったら砕ける
    const c = Math.floor((r.x + 9) / TILE), ry = Math.floor((r.y + r.h) / TILE);
    if (isSolid(c, ry) || r.life <= 0 || r.y > LEVEL_H) {
      for (let k = 0; k < 5; k++) {
        particles.push({ x: r.x + 9, y: r.y + 9, vx: (Math.random() - .5) * 5, vy: -Math.random() * 4, life: 22, col: '#a89272' });
      }
      rocks.splice(i, 1);
      continue;
    }
    if (player.deadTimer === 0 && player.inv === 0 && hit(player, r)) {
      damagePlayer();
      rocks.splice(i, 1);
    }
  }
}

function drawRocks() {
  for (let i = 0; i < rocks.length; i++) {
    const r = rocks[i];
    const x = r.x - cam.x, y = r.y;
    ctx.save();
    ctx.translate(x + 9, y + 9); ctx.rotate(r.spin); ctx.translate(-(x + 9), -(y + 9));
    ctx.fillStyle = '#8a7a5e'; ctx.fillRect(x, y, 18, 18);
    ctx.fillStyle = '#a89272'; ctx.fillRect(x + 2, y + 2, 10, 6);
    ctx.fillStyle = '#5e523c'; ctx.fillRect(x + 4, y + 12, 12, 4);
    ctx.restore();
  }
}

function updatePet() {
  if (!pet) return;
  // ロマ子様の足あとを少し遅れてたどる（ジャンプもマネする）
  petTrail.push({ x: player.x, y: player.y, face: player.face });
  if (petTrail.length > 22) petTrail.shift();
  const t = petTrail[0];
  pet.x = t.x; pet.y = t.y + 10; pet.face = t.face;
  // 立ち止まったときは重ならないよう後ろに下がる
  if (Math.abs(pet.x - player.x) < 22 && Math.abs(pet.y - (player.y + 10)) < 12) {
    pet.x = player.x - (pet.face >= 0 ? 26 : -26);
  }
  pet.anim = Math.abs(player.vx) > 0.4 ? (Math.floor(frameCount / 7) % 2) : 0;
}

function updateEffects() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.32; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y += (p.vy !== undefined ? p.vy : -0.8); p.life--;
    if (p.life <= 0) popups.splice(i, 1);
  }
  if (shake > 0) shake--;
  if (msgTimer > 0) { msgTimer--; if (msgTimer === 0) msg = null; }
}

/* ---------------------------------------------------------
   9. 描画
   --------------------------------------------------------- */
const cam = { x: 0, y: 0 };

function updateCamera() {
  let target = player.x + player.w / 2 - VW / 2;
  cam.x += (target - cam.x) * 0.16;
  if (cam.x < 0) cam.x = 0;
  if (cam.x > LEVEL_W - VW) cam.x = LEVEL_W - VW;
}

function drawBackground() {
  if (theme === 'sky') { drawSkyBackground(); return; }
  if (theme === 'grass') { drawGrassBackground(); return; }
  if (theme === 'fort') { drawFortBackground(); return; }
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#5ab4ec');
  g.addColorStop(0.7, '#a8dcf7');
  g.addColorStop(1, '#dff1c8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // 遠景の丘
  ctx.fillStyle = '#7fc46a';
  for (let i = 0; i < 24; i++) {
    const hx = i * 240 - (cam.x * 0.25) % 240 - 120;
    ctx.beginPath();
    ctx.arc(hx, 420, 130, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillStyle = '#69ad57';
  for (let i = 0; i < 24; i++) {
    const hx = i * 190 - (cam.x * 0.4) % 190 - 60;
    ctx.beginPath();
    ctx.arc(hx, 440, 90, Math.PI, 0);
    ctx.fill();
  }
  // 雲
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for (let i = 0; i < 16; i++) {
    const cxp = i * 260 - (cam.x * 0.15) % 260 - 100;
    const cyp = 50 + (i % 3) * 42;
    puff(cxp, cyp, 26); puff(cxp + 26, cyp - 10, 32); puff(cxp + 56, cyp, 24);
  }
}
function puff(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function drawSkyBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#1f6fd4');
  g.addColorStop(0.45, '#63b3f2');
  g.addColorStop(1, '#cfeaff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // 一番遠くの雲海
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  for (let i = 0; i < 20; i++) {
    const x = i * 210 - (cam.x * 0.08) % 210 - 80;
    puff(x, 452, 78); puff(x + 70, 448, 60);
  }
  // 中景の雲
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 20; i++) {
    const x = i * 250 - (cam.x * 0.18) % 250 - 120;
    const y = 120 + (i % 4) * 70;
    puff(x, y, 30); puff(x + 32, y - 12, 38); puff(x + 68, y, 28);
  }
  // 手前の雲
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 14; i++) {
    const x = i * 330 - (cam.x * 0.34) % 330 - 150;
    const y = 60 + (i % 3) * 96;
    puff(x, y, 24); puff(x + 26, y - 10, 32); puff(x + 56, y, 22);
  }
  // ときどき飛んでいる鳥
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const x = ((i * 470 - cam.x * 0.5 - frameCount * 0.35) % 1400 + 1400) % 1400 - 100;
    const y = 70 + (i % 3) * 55 + Math.sin(frameCount / 40 + i) * 6;
    ctx.beginPath();
    ctx.moveTo(x - 7, y); ctx.quadraticCurveTo(x - 3, y - 5, x, y);
    ctx.quadraticCurveTo(x + 3, y - 5, x + 7, y);
    ctx.stroke();
  }
  ctx.lineWidth = 1;
}

function drawGrassBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#48a8e8');
  g.addColorStop(0.5, '#9fd8f2');
  g.addColorStop(0.78, '#e9f5c4');
  g.addColorStop(1, '#c6e88a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // 太陽
  ctx.fillStyle = 'rgba(255,250,200,.75)';
  puff(560 - cam.x * 0.02, 76, 34);
  ctx.fillStyle = 'rgba(255,255,230,.5)';
  puff(560 - cam.x * 0.02, 76, 50);

  // 遠くの山なみ
  ctx.fillStyle = '#8fb8a8';
  for (let i = 0; i < 22; i++) {
    const x = i * 200 - (cam.x * 0.1) % 200 - 100;
    ctx.beginPath();
    ctx.moveTo(x - 110, 336); ctx.lineTo(x, 214); ctx.lineTo(x + 110, 336);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#7aa78f';
  for (let i = 0; i < 22; i++) {
    const x = i * 165 - (cam.x * 0.16) % 165 - 60;
    ctx.beginPath();
    ctx.moveTo(x - 90, 344); ctx.lineTo(x, 250); ctx.lineTo(x + 90, 344);
    ctx.closePath(); ctx.fill();
  }
  // ゆるやかな草の丘（奥→手前）
  ctx.fillStyle = '#8ccf62';
  for (let i = 0; i < 26; i++) {
    const x = i * 230 - (cam.x * 0.26) % 230 - 110;
    ctx.beginPath(); ctx.arc(x, 430, 140, Math.PI, 0); ctx.fill();
  }
  ctx.fillStyle = '#6fbc4c';
  for (let i = 0; i < 26; i++) {
    const x = i * 175 - (cam.x * 0.42) % 175 - 50;
    ctx.beginPath(); ctx.arc(x, 448, 100, Math.PI, 0); ctx.fill();
  }
  // 雲
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = 0; i < 14; i++) {
    const x = i * 290 - (cam.x * 0.13) % 290 - 120;
    const y = 56 + (i % 3) * 44;
    puff(x, y, 22); puff(x + 24, y - 10, 29); puff(x + 52, y, 21);
  }
  // 風にゆれる草むら（手前）
  const sway = Math.sin(frameCount / 26) * 3;
  const BASE = 420;   // 地面のすぐ上から草が生えているように見せる
  for (let i = 0; i < 46; i++) {
    const x = i * 78 - (cam.x * 0.62) % 78 - 40;
    const h = 30 + (i % 4) * 11;
    ctx.strokeStyle = i % 2 ? '#4e9c39' : '#5fae44';
    ctx.lineWidth = 3;
    for (let b = -1; b <= 1; b++) {
      ctx.beginPath();
      ctx.moveTo(x + b * 8, BASE);
      ctx.quadraticCurveTo(x + b * 8 + sway, BASE - h * 0.6, x + b * 11 + sway * 2.2, BASE - h);
      ctx.stroke();
    }
    if (i % 5 === 0) {   // 花
      ctx.fillStyle = i % 10 === 0 ? '#ff8fbf' : '#fff0a0';
      puff(x + 13 + sway, BASE - h - 3, 4);
    }
  }
  ctx.lineWidth = 1;
}

function drawFortBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#2a1a2e');
  g.addColorStop(0.6, '#3d2733');
  g.addColorStop(1, '#241820');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // 奥の石壁
  const off = (cam.x * 0.35) % 64;
  for (let r = 0; r < 9; r++) {
    for (let c = -1; c < 12; c++) {
      const x = c * 64 - off + (r % 2 ? 32 : 0), y = r * 54;
      ctx.fillStyle = (r + c) % 3 === 0 ? '#4a3340' : '#443040';
      ctx.fillRect(x, y, 62, 52);
      ctx.fillStyle = 'rgba(255,255,255,.05)';
      ctx.fillRect(x, y, 62, 4);
    }
  }
  // 柱
  const poff = (cam.x * 0.55) % 320;
  for (let i = -1; i < 4; i++) {
    const x = i * 320 - poff + 80;
    ctx.fillStyle = '#584056'; ctx.fillRect(x, 0, 42, VH);
    ctx.fillStyle = '#6b4f68'; ctx.fillRect(x, 0, 10, VH);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(x + 34, 0, 8, VH);
    // 虎の旗
    ctx.fillStyle = '#8f2b2b'; ctx.fillRect(x - 26, 34, 94, 118);
    ctx.fillStyle = '#6d1f1f'; ctx.fillRect(x - 26, 148, 94, 12);
    // 虎の顔（耳・縞・牙）
    ctx.fillStyle = '#f0801f';
    ctx.beginPath(); ctx.moveTo(x - 3, 70); ctx.lineTo(x + 4, 52); ctx.lineTo(x + 13, 70); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 29, 70); ctx.lineTo(x + 38, 52); ctx.lineTo(x + 45, 70); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 21, 90, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3b1f0b';
    ctx.fillRect(x + 2, 74, 5, 12); ctx.fillRect(x + 35, 74, 5, 12);   // 縞
    ctx.fillRect(x + 9, 84, 7, 6); ctx.fillRect(x + 26, 84, 7, 6);     // 目
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 12, 100, 18, 8);
    ctx.fillStyle = '#3b1f0b';
    ctx.fillRect(x + 16, 100, 2, 5); ctx.fillRect(x + 24, 100, 2, 5);
  }
  // 松明（ゆらめく炎）
  const toff = (cam.x * 0.75) % 200;
  for (let i = -1; i < 6; i++) {
    const x = i * 200 - toff + 40, y = 210;
    ctx.fillStyle = '#3b2b22'; ctx.fillRect(x, y, 9, 30);
    const fl = Math.sin(frameCount / 4 + i) * 3;
    ctx.fillStyle = 'rgba(255,150,40,.10)';
    ctx.beginPath(); ctx.arc(x + 4, y - 6, 46 + fl, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,170,60,.13)';
    ctx.beginPath(); ctx.arc(x + 4, y - 6, 26 + fl, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff9b1f';
    ctx.beginPath();
    ctx.moveTo(x - 6, y); ctx.quadraticCurveTo(x + 4, y - 26 - fl, x + 14, y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath();
    ctx.moveTo(x - 1, y); ctx.quadraticCurveTo(x + 4, y - 14 - fl, x + 9, y);
    ctx.closePath(); ctx.fill();
  }
  // 全体をすこし暗く
  ctx.fillStyle = 'rgba(20,8,25,.22)';
  ctx.fillRect(0, 0, VW, VH);
}

function drawFortTile(x, y, top) {
  ctx.fillStyle = '#7a6b74';
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#665860';
  ctx.fillRect(x, y + 15, TILE, 3); ctx.fillRect(x + 15, y, 3, 15);
  ctx.fillRect(x + 7, y + 18, 3, 14); ctx.fillRect(x + 23, y + 18, 3, 14);
  if (top) {
    ctx.fillStyle = '#94848d'; ctx.fillRect(x, y, TILE, 6);
    ctx.fillStyle = '#a99aa2'; ctx.fillRect(x, y, TILE, 2);
  }
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(x, y + TILE - 3, TILE, 3);
}

function drawGrassTile(x, y, top) {
  ctx.fillStyle = '#8a6a3c';
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#75592f';
  ctx.fillRect(x, y + 20, TILE, 4); ctx.fillRect(x + 13, y + 9, 5, 5);
  if (top) {
    ctx.fillStyle = '#4e9c39'; ctx.fillRect(x, y, TILE, 12);
    ctx.fillStyle = '#6fc44c'; ctx.fillRect(x, y, TILE, 6);
    // 草の穂
    ctx.fillStyle = '#8ddb63';
    const s = Math.round(Math.sin(frameCount / 22 + x) * 1.5);
    ctx.fillRect(x + 5 + s, y - 5, 2, 6);
    ctx.fillRect(x + 15 - s, y - 7, 2, 8);
    ctx.fillRect(x + 25 + s, y - 4, 2, 5);
  }
  ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(x, y + TILE - 3, TILE, 3);
}

function drawCloudTile(x, y, topOpen) {
  ctx.fillStyle = '#e8f4ff';
  ctx.fillRect(x, y + 8, TILE, TILE - 8);
  ctx.fillStyle = '#ffffff';
  if (topOpen) {
    ctx.beginPath();
    ctx.arc(x + 8, y + 10, 10, 0, Math.PI * 2);
    ctx.arc(x + 23, y + 8, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x, y + 10, TILE, 12);
  } else {
    ctx.fillRect(x, y, TILE, 12);
  }
  ctx.fillStyle = '#a9cfe8';
  ctx.fillRect(x, y + TILE - 5, TILE, 5);
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.fillRect(x + 4, y + 14, 6, 4);
}

function drawTiles() {
  const cStart = Math.max(0, Math.floor(cam.x / TILE) - 1);
  const cEnd = Math.min(COLS - 1, Math.ceil((cam.x + VW) / TILE) + 1);
  for (let c = cStart; c <= cEnd; c++) {
    for (let r = 0; r < ROWS; r++) {
      const t = MAP[r][c];
      if (t === '.') continue;
      const x = c * TILE - cam.x, y = r * TILE;
      if (t === '#') {
        const top = !isSolid(c, r - 1);
        if (theme === 'sky') { drawCloudTile(x, y, top); continue; }
        if (theme === 'grass') { drawGrassTile(x, y, top); continue; }
        if (theme === 'fort') { drawFortTile(x, y, top); continue; }
        ctx.fillStyle = '#a4622d'; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#8a4f22';
        ctx.fillRect(x, y + 20, TILE, 4); ctx.fillRect(x + 12, y + 8, 5, 5);
        if (top) {
          ctx.fillStyle = '#5cb34a'; ctx.fillRect(x, y, TILE, 10);
          ctx.fillStyle = '#78d465'; ctx.fillRect(x, y, TILE, 4);
        }
        ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x, y + TILE - 3, TILE, 3);
      } else if (t === '=') {
        ctx.fillStyle = '#c26b3a'; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#8f4a24';
        ctx.fillRect(x, y + 15, TILE, 2); ctx.fillRect(x + 15, y, 2, 15); ctx.fillRect(x + 7, y + 17, 2, 15); ctx.fillRect(x + 23, y + 17, 2, 15);
        ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.strokeRect(x + .5, y + .5, TILE - 1, TILE - 1);
      } else if (t === 'X') {
        // 大草原では岩ではなく草の生えた土の丘にする
        if (theme === 'grass') { drawGrassTile(x, y, !isSolid(c, r - 1)); continue; }
        if (theme === 'fort') { drawFortTile(x, y, !isSolid(c, r - 1)); continue; }
        ctx.fillStyle = '#8b8f9a'; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#6b707c'; ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
        ctx.fillStyle = '#a9aeb8'; ctx.fillRect(x + 6, y + 6, 8, 4);
      } else if (t === 'U') {
        ctx.fillStyle = '#96733e'; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#7a5c30'; ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
      } else if (t === '?' || t === '!' || t === '1' || t === 'K') {
        const blink = Math.sin(frameCount / 8) * 0.3 + 0.7;
        ctx.fillStyle = t === '!' ? '#ff8fbf' : (t === '1' ? '#e8484f' : (t === 'K' ? '#e08fb0' : '#e8a33d'));
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = 'rgba(255,255,255,' + (blink * 0.5) + ')';
        ctx.fillRect(x + 2, y + 2, TILE - 4, 4);
        ctx.fillStyle = '#5a3a12';
        ctx.fillRect(x + 2, y + 2, 4, 4); ctx.fillRect(x + TILE - 6, y + 2, 4, 4);
        ctx.fillRect(x + 2, y + TILE - 6, 4, 4); ctx.fillRect(x + TILE - 6, y + TILE - 6, 4, 4);
        if (t === 'K') {
          // コブタの顔
          ctx.fillStyle = '#ffd9e6';
          ctx.fillRect(x + 8, y + 10, 16, 13);
          ctx.fillRect(x + 6, y + 7, 5, 5); ctx.fillRect(x + 21, y + 7, 5, 5);
          ctx.fillStyle = '#8a3a55';
          ctx.fillRect(x + 11, y + 13, 3, 3); ctx.fillRect(x + 18, y + 13, 3, 3);
          ctx.fillStyle = '#e0789a'; ctx.fillRect(x + 12, y + 18, 8, 5);
          ctx.fillStyle = '#8a3a55'; ctx.fillRect(x + 14, y + 19, 1, 3); ctx.fillRect(x + 17, y + 19, 1, 3);
        } else {
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
          ctx.fillText(t === '!' ? '♛' : (t === '1' ? '♥' : '?'), x + TILE / 2, y + TILE / 2 + 7);
          ctx.textAlign = 'left';
        }
      } else if (t === 'C') {
        drawSprite(COIN, x + 6, y + 6 + Math.sin(frameCount / 10 + c) * 2, 2, false);
      } else if (t === 'G') {
        // ゴールの旗
        ctx.fillStyle = '#3d3d4a';
        ctx.fillRect(x + 13, y - 9 * TILE, 6, 9 * TILE + TILE);
        ctx.fillStyle = '#ffd93b';
        ctx.beginPath(); ctx.arc(x + 16, y - 9 * TILE, 8, 0, Math.PI * 2); ctx.fill();
        const wav = Math.sin(frameCount / 10) * 5;
        ctx.fillStyle = '#ff6ba8';
        ctx.beginPath();
        ctx.moveTo(x + 19, y - 9 * TILE + 12);
        ctx.lineTo(x + 19 + 60 + wav, y - 9 * TILE + 30);
        ctx.lineTo(x + 19, y - 9 * TILE + 48);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
        ctx.fillText('♛', x + 30, y - 9 * TILE + 36);
      }
    }
  }
}

function drawPet() {
  if (!pet) return;
  drawSprite(KOBUTA[pet.anim || 0], pet.x - cam.x - 1, pet.y, 2, pet.face < 0);
}

function drawPlayer() {
  if (player.inv > 0 && Math.floor(frameCount / 4) % 2 === 0 && player.deadTimer === 0) return;
  const ch = CHARS[charIdx];
  const sp = ch.sprites[player.anim];
  const x = player.x - cam.x - 2;
  const y = player.y - 2;
  ctx.save();
  if (player.deadTimer > 0 && player.deadTimer < 70) {
    ctx.translate(x + 14, y + 18); ctx.rotate((70 - player.deadTimer) * 0.06); ctx.translate(-(x + 14), -(y + 18));
  }
  drawSprite(sp, x, y, 2, player.face < 0);
  if (player.crown) {
    drawSprite(CROWN, x + 2, y - 12, 2, false);
  }
  ctx.restore();
}

function drawEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.x < cam.x - 80 || e.x > cam.x + VW + 80) continue;
    const set = e.type === 'wolf' ? WOLF : (e.type === 'mouse' ? MOUSE : OTAKU);
    const sp = set[e.dead ? 0 : (e.anim || 0)];
    const x = e.x - cam.x - 2, y = e.y - 2;
    ctx.save();
    // ネズミの溜め・ダッシュの見せ方
    if (e.type === 'mouse' && !e.dead) {
      if (e.phase === 'crouch') {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + Math.sin(frameCount / 2.5) * 0.25) + ')';
        ctx.fillRect(x + 4, y - 8, 24, 4);
      } else if (e.phase === 'dash') {
        ctx.fillStyle = 'rgba(255,255,255,.45)';
        for (let s = 1; s <= 3; s++) {
          ctx.fillRect(x + (e.face > 0 ? -8 * s : 30 + 8 * s), y + 10 + s * 5, 7, 2);
        }
      }
    }
    if (e.dead) {
      ctx.globalAlpha = Math.max(0, e.dead / 30);
      ctx.translate(x + 16, y + 18); ctx.rotate(e.rot || 0); ctx.translate(-(x + 16), -(y + 18));
    }
    drawSprite(sp, x, y, 2, e.face > 0);
    ctx.restore();

    // キモオタのフラッシュ
    if (e.type === 'otaku' && !e.dead) {
      if (e.phase === 'aim') {
        ctx.fillStyle = 'rgba(255,60,60,' + (0.35 + Math.sin(frameCount / 3) * 0.3) + ')';
        ctx.fillRect(x + (e.face > 0 ? 30 : -4), y + 20, 6, 6);
      } else if (e.phase === 'flash') {
        const a = Math.min(1, e.flash / 16);
        const dir = e.face > 0 ? 1 : -1;
        const R = 92;
        const bx = dir > 0 ? e.x + e.w - cam.x : e.x - R - cam.x;
        const gg = ctx.createLinearGradient(bx, 0, bx + R, 0);
        if (dir > 0) { gg.addColorStop(0, 'rgba(255,255,220,' + a + ')'); gg.addColorStop(1, 'rgba(255,255,220,0)'); }
        else { gg.addColorStop(0, 'rgba(255,255,220,0)'); gg.addColorStop(1, 'rgba(255,255,220,' + a + ')'); }
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.moveTo(dir > 0 ? bx : bx + R, e.y + 16);
        ctx.lineTo(dir > 0 ? bx + R : bx, e.y - 2);
        ctx.lineTo(dir > 0 ? bx + R : bx, e.y + 34);
        ctx.closePath(); ctx.fill();
      }
    }
  }
}

function drawPoops() {
  for (let i = 0; i < poops.length; i++) {
    const p = poops[i];
    ctx.save();
    ctx.translate(p.x - cam.x + 6, p.y + 6);
    ctx.rotate(p.spin);
    drawSprite(POOP, -12, -12, 2, false);
    ctx.restore();
  }
}

function drawItems() {
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.type === 'hairpin') {
      // ほんのり光らせる
      ctx.fillStyle = 'rgba(255,90,110,' + (0.18 + Math.sin(frameCount / 6) * 0.12) + ')';
      ctx.beginPath(); ctx.arc(it.x - cam.x + 15, it.y + 10, 22, 0, Math.PI * 2); ctx.fill();
      drawSprite(HAIRPIN, it.x - cam.x, it.y, 2, false);
    } else if (it.type === 'kobuta') {
      ctx.fillStyle = 'rgba(255,176,196,' + (0.2 + Math.sin(frameCount / 6) * 0.12) + ')';
      ctx.beginPath(); ctx.arc(it.x - cam.x + 14, it.y + 12, 25, 0, Math.PI * 2); ctx.fill();
      drawSprite(KOBUTA[Math.floor(frameCount / 16) % 2], it.x - cam.x, it.y, 2, false);
    } else {
      drawSprite(CROWN, it.x - cam.x, it.y, 2, false);
    }
  }
}

function drawEffects() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.col;
    ctx.fillRect((p.x - cam.x) | 0, p.y | 0, 5, 5);
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    ctx.globalAlpha = Math.min(1, p.life / 20);
    if (p.big) {
      // 断末魔はドット絵風に太く・黒フチつきで
      ctx.font = 'bold 22px "Hiragino Maru Gothic ProN", "Yu Gothic", monospace';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 7; ctx.strokeStyle = '#1b1027';
      ctx.strokeText(p.t, p.x - cam.x, p.y);
      ctx.lineWidth = 3; ctx.strokeStyle = '#7a3b12';
      ctx.strokeText(p.t, p.x - cam.x, p.y);
      ctx.fillStyle = p.col || '#ffd93b';
      ctx.fillText(p.t, p.x - cam.x, p.y);
      ctx.lineWidth = 1;
    } else {
      ctx.font = 'bold 14px monospace';
      ctx.fillStyle = p.col || '#fff';
      ctx.fillText(p.t, p.x - cam.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = 'rgba(20,8,35,.6)';
  ctx.fillRect(0, 0, VW, 34);
  ctx.font = 'bold 15px monospace';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + String(score).padStart(6, '0'), 8, 23);
  ctx.fillStyle = '#ffd93b';
  ctx.fillText('💰' + String(coins).padStart(2, '0'), 148, 23);
  ctx.fillStyle = CHARS[charIdx].color;
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(CHARS[charIdx].name, 205, 23);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px monospace';
  ctx.fillText('×' + lives, 300, 23);
  ctx.fillStyle = player.crown ? '#ffd93b' : '#6b6b7d';
  ctx.fillText(player.crown ? '👑うんこOK' : '👑なし', 348, 23);
  ctx.fillStyle = '#8fd6ff';
  ctx.fillText('ST' + (stage + 1), 480, 23);
  ctx.fillStyle = '#fff';
  ctx.fillText('TIME ' + Math.ceil(timeLeft), 535, 23);

  // ボスのHPバー
  if (boss && boss.phase !== 'sleep') {
    const bw = 300, bx0 = VW / 2 - bw / 2, by0 = VH - 34;
    ctx.fillStyle = 'rgba(20,8,35,.75)';
    ctx.fillRect(bx0 - 6, by0 - 18, bw + 12, 30);
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ffb37a';
    ctx.fillText('虎', bx0, by0 - 6);
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.fillRect(bx0, by0 - 2, bw, 12);
    ctx.fillStyle = boss.hp <= 2 ? '#ef4444' : '#f0801f';
    ctx.fillRect(bx0, by0 - 2, bw * (boss.hp / boss.maxHp), 12);
    ctx.strokeStyle = '#ffd9b8'; ctx.lineWidth = 2;
    ctx.strokeRect(bx0, by0 - 2, bw, 12); ctx.lineWidth = 1;
  }

  // 進行度バー
  const prog = Math.min(1, (player.x + player.w / 2) / LEVEL_W);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(10, 28, VW - 20, 3);
  ctx.fillStyle = CHARS[charIdx].color;
  ctx.fillRect(10, 28, (VW - 20) * prog, 3);

  if (msg) {
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    const w = ctx.measureText(msg).width + 28;
    ctx.fillStyle = 'rgba(20,8,35,.82)';
    ctx.fillRect(VW / 2 - w / 2, 46, w, 34);
    ctx.fillStyle = '#ffd93b';
    ctx.fillText(msg, VW / 2, 70);
    ctx.textAlign = 'left';
  }
}

function centerText(lines) {
  ctx.fillStyle = 'rgba(16,7,28,.86)';
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  let y = 130;
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i];
    ctx.font = L.f || 'bold 22px sans-serif';
    ctx.fillStyle = L.c || '#fff';
    ctx.fillText(L.t, VW / 2, y);
    y += L.gap || 34;
  }
  ctx.textAlign = 'left';
}

function drawTitle() {
  drawBackground();
  ctx.fillStyle = 'rgba(16,7,28,.55)';
  ctx.fillRect(0, 0, VW, VH);

  drawSprite(ROMAKO[0], 78, 250, 5, false);
  drawSprite(CROWN, 86, 220, 5, false);
  drawSprite(YAMIKO[0], 186, 250, 5, false);
  drawSprite(ROMAKO[0], 78, 250, 5, false);
  drawSprite(KOBUTA[0], 258, 300, 3, false);
  drawSprite(TIGER[0], 486, 236, 4, true);
  drawSprite(WOLF[0], 330, 268, 3, true);
  drawSprite(OTAKU[0], 396, 266, 3, true);
  drawSprite(MOUSE[0], 440, 268, 3, true);
  drawSprite(POOP, 196, 318, 3, false);
  drawSprite(HAIRPIN, 250, 246, 3, false);

  ctx.textAlign = 'center';
  ctx.font = 'bold 44px sans-serif';
  ctx.fillStyle = '#ffd93b';
  ctx.fillText('ロマ子アクション', VW / 2, 88);
  ctx.font = 'bold 18px sans-serif';
  ctx.fillStyle = '#8fd6ff';
  ctx.fillText('〜 王冠とうんこの伝説 〜', VW / 2, 116);
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('👑をとると 💩 が投げられる。当たった敵は死ぬ。', VW / 2, 156);
  ctx.fillStyle = '#ffb0b8';
  ctx.fillText('赤いヘアピンは 1UP。コブタは身代わり。全4ステージ！', VW / 2, 180);
  ctx.fillStyle = '#c9e6ff';
  ctx.fillText('ロマ子様がやられたら ヤミ子 が交代で出撃！', VW / 2, 204);
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = Math.floor(frameCount / 20) % 2 ? '#fff' : '#ffd93b';
  ctx.fillText('スペースキー / 画面のボタン で スタート', VW / 2, 430);
  ctx.textAlign = 'left';
}

function drawOver() {
  centerText([
    { t: 'GAME OVER', f: 'bold 46px sans-serif', c: '#ff6b6b', gap: 56 },
    { t: 'ロマ子様もヤミ子も力尽きた……', f: 'bold 20px sans-serif', c: '#fff', gap: 44 },
    { t: 'SCORE ' + score + '　　💰 ' + coins, f: 'bold 24px monospace', c: '#ffd93b', gap: 60 },
    { t: 'スペースキー / 画面のボタン でもう一度', f: 'bold 18px sans-serif', c: Math.floor(frameCount / 20) % 2 ? '#fff' : '#9d5cf6' }
  ]);
}

function drawClear() {
  centerText([
    { t: 'STAGE ' + (stage + 1) + ' CLEAR !', f: 'bold 40px sans-serif', c: '#ffd93b', gap: 52 },
    { t: 'SCORE ' + score + '　　のこり ' + lives + '人', f: 'bold 22px monospace', c: '#fff', gap: 64 },
    { t: 'つぎは STAGE ' + (stage + 2) + '「' + STAGES[stage + 1].title + '」', f: 'bold 24px sans-serif', c: '#8fd6ff', gap: 52 },
    { t: Math.floor(frameCount / 14) % 2 ? '出発！' : '　', f: 'bold 20px sans-serif', c: '#fff' }
  ]);
  drawSprite(ROMAKO[0], VW / 2 - 35, 330, 5, false);
}

function drawAllClear() {
  centerText([
    { t: 'ALL CLEAR !!', f: 'bold 46px sans-serif', c: '#ffd93b', gap: 52 },
    { t: '虎の要塞は陥ちた。王国に平和が戻った（においは残った）', f: 'bold 17px sans-serif', c: '#fff', gap: 44 },
    { t: 'TOTAL SCORE ' + score, f: 'bold 30px monospace', c: '#8fd6ff', gap: 38 },
    { t: '💰 ' + coins + '　　のこり ' + lives + '人', f: 'bold 20px monospace', c: '#fff', gap: 56 },
    { t: 'スペースキー / 画面のボタン でもう一度', f: 'bold 18px sans-serif', c: Math.floor(frameCount / 20) % 2 ? '#fff' : '#4da6ff' }
  ]);
  drawSprite(ROMAKO[0], VW / 2 - 90, 330, 5, false);
  drawSprite(CROWN, VW / 2 - 82, 300, 5, false);
  drawSprite(YAMIKO[0], VW / 2 + 20, 330, 5, false);
}

/* ---------------------------------------------------------
   10. メインループ
   --------------------------------------------------------- */
function loop() {
  frameCount++;

  if (state === 'play') {
    timeLeft -= 1 / 60;
    if (timeLeft <= 0) { timeLeft = 0; killPlayer(false); }
    updatePlayer();
    updateEnemies();
    updatePoops();
    updateItems();
    updatePet();
    updateBoss();
    updateRocks();
    updateEffects();
    updateCamera();
  } else {
    updateEffects();
    if (state === 'clear') {
      clearTimer--;
      if (clearTimer <= 0) startStage(stage + 1);
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, VW, VH);

  if (state === 'title') {
    drawTitle();
  } else {
    if (shake > 0) ctx.setTransform(1, 0, 0, 1, (Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawBackground();
    drawTiles();
    drawItems();
    drawEnemies();
    drawBoss();
    drawRocks();
    drawPoops();
    drawPet();
    drawPlayer();
    drawEffects();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawHUD();
    if (state === 'over') drawOver();
    if (state === 'clear') drawClear();
    if (state === 'allclear') drawAllClear();
  }

  requestAnimationFrame(loop);
}

// タイトル画面の裏側にステージ1を用意しておく
theme = STAGES[0].theme;
buildMap(STAGES[0].chunks);
resetLevelObjects();
spawnPlayer(64);
cam.x = 0;
loop();

})();
</script>
